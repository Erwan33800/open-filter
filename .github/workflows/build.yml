name: Build

on:
  push:
  workflow_dispatch:

# Toute la CI (tests, Windows, macOS, pluginval, release « latest ») vient du workflow commun d'open-core.
# La version d'open-core utilisée pour compiler est dans OPEN_CORE_VERSION ; en changeant de version, mets aussi à jour
# la référence @vX.Y.Z ci-dessous (elle fixe la version du workflow lui-même).
jobs:
  build:
    uses: Erwan33800/open-core/.github/workflows/plugin.yml@v0.1.0
    permissions:
      contents: write
    with:
      target: OpenFilter
      product-name: Open Filter
      slug: openfilter
      dsp-tests-args: -DOPENFILTER_PLUGIN=OFF
      tests-target: OpenFilterTests
      ui-test-command: python3 tests/ui/bridge_test.py
